# .github/workflows/backend-ci.yml
name: Backend CI Pipeline

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # IMPORTANT: Ensure cache points to the correct build tool!
        cache: 'maven' # Use 'gradle' if you generated a Gradle project

    # --- MODIFIED STEP ---
    - name: Build with Maven
      # -B runs in non-interactive (batch) mode
      # --file points explicitly to the pom.xml inside the backend directory
      run: mvn -B package --file backend/pom.xml
      # If using Gradle: run: ./gradlew build -p backend

    # --- MODIFIED STEP ---
    - name: Run Unit Tests with Maven
      # This command specifically runs tests. Often included in 'package',
      # but running explicitly can sometimes provide clearer test results/reports.
      run: mvn -B test --file backend/pom.xml
      # If using Gradle: run: ./gradlew test -p backend

