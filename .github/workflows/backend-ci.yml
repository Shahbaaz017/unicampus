# .github/workflows/backend-ci.yml
name: Backend CI & SonarCloud Analysis

on:
  push:
    branches: [ develop ] # Your integration branch
    paths: # Only trigger if relevant files change
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ develop, main ] # PRs targeting your main branches
    types: [opened, synchronize, reopened] # Types recommended by SonarCloud
    paths: # Only trigger if relevant files change
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  build-analyze-sonar: # Consistent job name
    name: Build, Test and Analyze Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # SonarCloud recommendation for analysis relevancy

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin' # Keep temurin as previously configured

    # Use SonarCloud recommended caching strategy
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository # Correct path for default Maven repo
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build, Test and Analyze with SonarCloud
      env:
        # Secret from GitHub repository settings
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Required for SonarCloud pull request decoration
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Run verify (runs tests/JaCoCo) then Sonar plugin goal
      # Explicitly point to backend pom.xml
      # Use exact project key from SonarCloud
      # Explicitly define scanner version (good practice, match pom.xml)
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar -Dsonar.projectKey=iamsjeevan_unicampus --file backend/pom.xml