# infrastructure/ansible/roles/backend_app/tasks/main.yml
---
# Tasks to deploy the unicampus backend Docker container

- name: Ensure Docker SDK for Python is installed
  ansible.builtin.pip:
    name: docker # Ansible's docker modules require this
    state: present
  become: true # Needs sudo/root privileges

- name: Pull latest backend image from GHCR
  community.docker.docker_image:
    name: "ghcr.io/{{ ghcr_owner | lower }}/unicampus:latest" # Uses variable from playbook
    source: pull
    force_source: true # Always pull to ensure latest image
  become: true # Docker ops often require elevation

- name: Stop and remove existing backend container if running
  community.docker.docker_container:
    name: unicampus-backend-container # Consistent container name
    state: absent # Ensure clean state before starting new one
  become: true
  ignore_errors: true # Don't fail if container doesn't exist yet

- name: Run the unicampus backend container
  community.docker.docker_container:
    name: unicampus-backend-container
    image: "ghcr.io/{{ ghcr_owner | lower }}/unicampus:latest" # Image to run
    state: started # Ensure container is running
    restart_policy: always # Restart if it stops or on server reboot
    ports:
      - "8080:8080" # Map host port 8080 to container port 8080
    # Add other options like env vars, volumes later if needed
  become: true # Docker ops often require elevation