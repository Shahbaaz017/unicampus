# .github/workflows/backend-ci.yml
name: Backend CI, Analysis & Docker Build/Push

on:
  # ... (on triggers remain the same) ...
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ develop, main ]
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-analyze-push-image: # Updated job ID
    name: Build, Test, Analyze Backend & Push Docker Image
    runs-on: ubuntu-latest

    # --- NEW: Permissions for GHCR ---
    # Need write permission for packages to push to GHCR
    permissions:
      contents: read
      packages: write # Add this permission

    steps:
    # ... (Checkout, Set up JDK, Caching, Build/Test/Analyze steps remain the same) ...
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build, Test and Analyze with SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar -Dsonar.projectKey=iamsjeevan_unicampus --file backend/pom.xml

    # --- NEW STEP: Log in to GHCR ---
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        # GITHUB_TOKEN has permission to push to repo's GHCR automatically
        username: ${{ github.actor }} # Your GitHub username
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # --- MODIFIED STEP: Build and Push Docker image ---
    - name: Build and push Docker image to GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend
        # Enable push to registry
        push: true
        # Define tags for GHCR: latest and unique Git SHA
        # OWNER should be lowercase, REPO_NAME should be lowercase
        tags: |
          ghcr.io/${{ github.repository_owner }}/unicampus:latest
          ghcr.io/${{ github.repository_owner }}/unicampus:${{ github.sha }}
        # Enable Docker layer caching
        cache-from: type=gha
        cache-to: type=gha,mode=max