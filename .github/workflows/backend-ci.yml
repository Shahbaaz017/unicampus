# .github/workflows/backend-ci.yml
name: Backend CI, Analysis & Docker Build/Push

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ develop, main ]
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-analyze-push-image: # Updated job ID
    name: Build, Test, Analyze Backend & Push Docker Image
    runs-on: ubuntu-latest

    # Permissions for GHCR push
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # Add this step right after checkout
    - name: Decode Firebase SA JSON
      run: |
        echo "Decoding Firebase key into backend directory..."
        echo "${{ secrets.FIREBASE_SA_B64 }}" | base64 --decode > backend/firebase-service-account.json
        echo "Key file created in backend directory."
      env:
        FIREBASE_SA_B64: ${{ secrets.FIREBASE_SA_B64 }} # For SonarCloud PR analysis

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    # SonarCloud Recommended Caching
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build, Test and Analyze with SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar -Dsonar.projectKey=iamsjeevan_unicampus --file backend/pom.xml

    # Docker Login & Build/Push Steps
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image to GHCR
      uses: docker/build-push-action@v5
      with:
        # Use repo root as context
        context: .
        # Point to Dockerfile within backend directory
        file: ./backend/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/unicampus:latest
          ghcr.io/${{ github.repository_owner }}/unicampus:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max